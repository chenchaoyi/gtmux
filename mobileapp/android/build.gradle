buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"

// Native dependencies share the AGP version selected by this React Native release.
// Older library build scripts must not load a second, incompatible AGP into Gradle.
subprojects {
    buildscript.configurations.configureEach {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == "com.android.tools.build" && details.requested.name == "gradle") details.useVersion("8.12.0")
        }
    }
}

// Compile all native adapters against the host SDK; some libraries still pin an older compileSdk.
subprojects { project ->
    project.plugins.withId("com.android.library") {
        project.extensions.getByName("androidComponents").finalizeDsl { androidDsl ->
            androidDsl.compileSdk = rootProject.ext.compileSdkVersion
        }
    }
}
