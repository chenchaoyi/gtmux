# gtmux tunnel control-plane Worker.
#
# Runs at api.gtmux.ccy.dev. The `gtmux tunnel` CLI POSTs here to (idempotently)
# provision a Cloudflare named tunnel + a stable `<id>.gtmux.ccy.dev` hostname for
# the caller's Mac, and returns the connector token the Mac's cloudflared runs
# with. Cloudflare carries the data plane (free); this Worker is the only piece
# gtmux operates.
#
# It ALSO gates the paid "Direct" tunnel: POST /direct/redeem validates an access code
# against the DIRECT_CODES KV and, only on a hit, returns the Direct server config
# ({url, secret}) — so that secret is NEVER in the (public) client binary. Mint codes
# with ./issue-direct-code.sh; revoke by deleting the KV key.
#
# Deploy:  wrangler deploy
# Secrets: wrangler secret put CF_API_TOKEN   (zone ccy.dev DNS:Edit + account Cloudflare Tunnel:Edit)
#          wrangler secret put REG_SECRET      (soft anti-abuse gate baked into the CLI build)
#          wrangler secret put DIRECT_URL      (the Direct server base, e.g. https://tunnel.ccy.dev)
#          wrangler secret put DIRECT_SECRET   (the Direct chisel auth, user:pass)
# KV:      wrangler kv namespace create TUNNELS        → paste the id below
#          wrangler kv namespace create DIRECT_CODES   → paste the id below

name = "gtmux-tunnel"
main = "src/index.ts"
compatibility_date = "2025-06-01"
workers_dev = true

# Serve the control plane at a stable hostname under the gtmux namespace.
routes = [{ pattern = "api.gtmux.ccy.dev", custom_domain = true }]

# deviceId -> { tunnelId, label, hostname } so re-runs reuse the same tunnel.
# DIRECT_CODES: code -> {label, redemptions…}; membership = a valid paid Direct code.
kv_namespaces = [
  { binding = "TUNNELS", id = "bd42c0b0a0734850bf42def27b14b98b" },
  { binding = "DIRECT_CODES", id = "3be897460ff24a37915d30e5fa4ebb52" },
]

[vars]
# The zone tunnels live in. Hosts are single-level `gtmux-<id>.ccy.dev` so the
# free Universal cert (*.ccy.dev) covers them (a 3rd level would need paid ACM).
ZONE_NAME = "ccy.dev"
# The local service on the Mac that cloudflared forwards to (gtmux serve default).
LOCAL_SERVICE = "http://localhost:8765"
# Non-secret account/zone ids (the runtime CF_API_TOKEN secret carries the auth).
CF_ACCOUNT_ID = "e6ad9be63f53997c5844317404a4b043"
CF_ZONE_ID = "18e9882c3234f0f2a76ac6dcd0cf29ae"
# Abuse caps on NEW-tunnel creation (REG_SECRET ships in the public binary, so it's
# only a soft gate). A legit Mac creates ONE tunnel per stable deviceId and every
# re-provision is idempotent (no new resource, not counted) — so these ceilings are
# far above any real single-user need. Tune here; no redeploy of the CLI needed.
PROVISION_IP_CAP = "5"       # max NEW tunnels per client IP per 24h
PROVISION_GLOBAL_CAP = "500" # max total active gtmux tunnels
# Reaper (daily cron below): delete abuse junk fast, real-but-abandoned tunnels slowly.
REAP_NEVER_CONNECTED_H = "24" # a tunnel that never connected + older than this → reap
REAP_IDLE_DAYS = "90"         # a tunnel idle (last connection) longer than this → reap

# Daily reaper: prune inactive/never-connected tunnels + their DNS so abuse can't
# accumulate and the global count self-corrects.
[triggers]
crons = ["0 4 * * *"]
