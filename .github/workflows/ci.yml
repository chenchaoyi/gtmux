name: ci

# The workflow always starts; scripts/ci.py conservatively chooses module gates.
# ci-required is the stable aggregate: selected jobs must succeed, never skip.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      core: ${{ steps.plan.outputs.core }}
      cross: ${{ steps.plan.outputs.cross }}
      mobile: ${{ steps.plan.outputs.mobile }}
      web: ${{ steps.plan.outputs.web }}
      menubar: ${{ steps.plan.outputs.menubar }}
      relay: ${{ steps.plan.outputs.relay }}
      tunnel: ${{ steps.plan.outputs.tunnel }}
      ios: ${{ steps.plan.outputs.ios }}
      android: ${{ steps.plan.outputs.android }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select checks (unknown impact runs everything)
        id: plan
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/ci.py plan

  quality:
    name: policy, docs and CI guards
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test design review precedes test implementation (PR history)
        if: github.event_name == 'pull_request'
        env:
          DESIGN_BASE: ${{ github.event.pull_request.base.sha }}
          DESIGN_HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/test_design.py --pr-history --base "$DESIGN_BASE" --head "$DESIGN_HEAD"
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Scope, aggregation and scanner failure regression tests
        run: make ci-test publisher-test
      - name: Validate every workflow (no signing secrets)
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -shellcheck='' .github/workflows/*.yml
      - name: Source design, bilingual docs and strict specs
        env:
          GTMUX_PRIVATE_TERMS: ${{ secrets.GTMUX_PRIVATE_TERMS }}
          GTMUX_PRIVATE_POLICY_REQUIRED: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: ./scripts/check-design.sh --source-only
      - name: Signed download service and generated trust anchors
        run: |
          python3 scripts/sync-release-feed.py --check
          bash -n bootstrap.sh install.sh
          npm --prefix download-worker test
          npm --prefix download-worker run build
      - name: Documentation examples against real builders
        run: go test ./internal/docs

  test:
    needs: scope
    if: needs.scope.outputs.core == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.27'
          cache: true

      - name: gofmt check
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: staticcheck
        # The Makefile owns both the pinned analyzer and compatible analysis toolchain.
        run: make lint

      - name: Install isolated terminal test prerequisite
        run: sudo apt-get update && sudo apt-get install -y tmux

      - name: go test (race + coverage)
        run: go test -race -coverprofile=coverage.out ./...

      - name: Linux systemd user-service acceptance (ephemeral CI account)
        run: |
          go test -c -o "$RUNNER_TEMP/gtmux-userservice.test" ./internal/userservice
          install -m 755 "$RUNNER_TEMP/gtmux-userservice.test" /tmp/gtmux-userservice.test
          test_user=gtmux-ci
          sudo useradd --create-home --shell /bin/sh "$test_user"
          test_uid="$(id -u "$test_user")"
          cleanup_test_user() {
            test_status=$?
            trap - EXIT
            # Disabling lingering can already stop the user manager. Preserve the
            # test result while still checking that the ephemeral account is removed.
            sudo loginctl disable-linger "$test_user" || true
            sudo loginctl terminate-user "$test_user" || true
            # User-manager shutdown can finish after loginctl returns. Wait only
            # for this throwaway UID; do not turn a cleanup failure into a pass.
            for attempt in $(seq 1 15); do
              pgrep -u "$test_uid" >/dev/null || break
              echo "Waiting for ephemeral test processes to exit ($attempt/15)"
              sleep 1
            done
            if ! sudo userdel --remove "$test_user"; then
              echo "::error::Could not remove the ephemeral Linux test account"
              if [ "$test_status" -eq 0 ]; then test_status=1; fi
            fi
            exit "$test_status"
          }
          trap cleanup_test_user EXIT
          sudo loginctl enable-linger "$test_user"
          for attempt in $(seq 1 30); do
            [ -S "/run/user/$test_uid/bus" ] && break
            sleep 1
          done
          sudo -u "$test_user" env HOME="/home/$test_user" XDG_RUNTIME_DIR="/run/user/$test_uid" DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$test_uid/bus" GTMUX_SYSTEMD_IT=1 /tmp/gtmux-userservice.test -test.v -test.run '^TestSystemdUserManagerLifecycle$'

      - name: Linux server acceptance (private tmux and HOME)
        run: |
          mkdir -p "$RUNNER_TEMP/gtmux-linux-smoke"
          CGO_ENABLED=0 go build -o "$RUNNER_TEMP/gtmux-linux-smoke/gtmux" ./cmd/gtmux
          python3 scripts/linux_smoke.py "$RUNNER_TEMP/gtmux-linux-smoke/gtmux"

      - name: coverage summary
        run: go tool cover -func=coverage.out | tail -1

      - name: Preserve coverage for review
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: go-coverage
          path: coverage.out
          retention-days: 7

      # A reachable known vulnerability with a fix available fails the build; one with no
      # fix upstream yet is printed as a warning. See the script for why.
      - name: vulncheck (reachable known vulnerabilities)
        run: ./scripts/vulncheck.sh

      # Architecture + design-palette invariants (also run on macOS with swift test).
      - name: design + architecture conformance
        run: ./scripts/check-design.sh

  cross-build:
    needs: scope
    if: needs.scope.outputs.cross == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.27'
          cache: true

      # The CLI must stay cgo-free (only the menu-bar app uses cgo). Build both
      # macOS arches with CGO off to enforce that and catch arch-specific breaks.
      - name: build CLI cgo-free (macOS + Linux, arm64 + amd64)
        run: |
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -o /dev/null ./cmd/gtmux
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -o /dev/null ./cmd/gtmux
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o /dev/null ./cmd/gtmux
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o /dev/null ./cmd/gtmux

  mobile:
    name: mobile app (tsc + eslint + jest)
    needs: scope
    if: needs.scope.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobileapp/package-lock.json

      # JS-only gate (no native build): typecheck, lint, and unit tests. Keeps the
      # RN app's pure logic (pairing, ANSI parser, api client, i18n, theme) honest.
      - name: install deps
        run: cd mobileapp && npm ci

      - name: typecheck (tsc)
        run: cd mobileapp && npx tsc --noEmit

      - name: lint (eslint)
        run: cd mobileapp && npx eslint .

      - name: jest
        run: cd mobileapp && npx jest --ci

      - name: test delivery helpers (synthetic credentials, no network)
        run: |
          python3 -m unittest discover -s mobileapp/scripts -p '*_test.py'
          node --test mobileapp/scripts/creative-layout.test.mjs

  android-native:
    name: Android QA build and native policies
    needs: scope
    if: needs.scope.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      package: ${{ steps.package.outputs.name }}
    env:
      GTMUX_SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobileapp/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Install JS dependencies
        working-directory: mobileapp
        run: |
          npm ci
      - name: Build bundled QA and test native policies
        working-directory: mobileapp/android
        run: ./gradlew :app:assembleQa :app:testQaUnitTest :app:lintQa -PreactNativeArchitectures=arm64-v8a,x86_64 --no-daemon --max-workers=2
      - name: Missing release credentials must fail closed
        working-directory: mobileapp/android
        run: |
          if ./gradlew :app:assembleRelease --no-daemon > "$RUNNER_TEMP/android-signing-refusal.log" 2>&1; then
            echo 'Release unexpectedly accepted absent signing credentials'; exit 1
          fi
          grep -q 'Release signing credentials are required' "$RUNNER_TEMP/android-signing-refusal.log"
      - name: Record exact QA package identity
        id: package
        run: |
          python3 scripts/android_ci_package.py write --source "$GITHUB_SHA" --run "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"
          echo "name=android-qa-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Preserve the checked QA package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            mobileapp/android/app/build/outputs/apk/qa/app-qa.apk
            mobileapp/android/app/build/outputs/apk/qa/CI-PACKAGE.json
          if-no-files-found: error
          retention-days: 7

  android-emulator:
    name: Android ${{ matrix.device }} emulator flows
    needs: [scope, android-native]
    if: needs.scope.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: phone
            profile: pixel_7
          - device: tablet
            profile: pixel_tablet
    steps:
      - uses: actions/checkout@v5
      - name: Isolate Android automation data
        run: |
          echo "APPIUM_HOME=$RUNNER_TEMP/gtmux-appium" >> "$GITHUB_ENV"
          echo "GTMUX_ANDROID_E2E_OUTPUT=$RUNNER_TEMP/gtmux-android-evidence" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobileapp/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android automation dependencies
        working-directory: mobileapp
        run: |
          npm ci
          npx appium driver install --source=local "$PWD/node_modules/appium-uiautomator2-driver"
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.android-native.outputs.package }}
          path: mobileapp/android/app/build/outputs/apk/qa
      - name: Verify the shared QA package before installation
        run: python3 scripts/android_ci_package.py verify --source "$GITHUB_SHA" --run "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"
      - name: Allow KVM on this disposable runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-gtmux-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise the complete synthetic suite
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.profile }}
          avd-name: gtmux-ci-${{ matrix.device }}
          force-avd-creation: true
          emulator-options: -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader
          script: ANDROID_SERIAL=emulator-5554 npm --prefix mobileapp run test:e2e:android
      - name: Preserve synthetic emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-${{ matrix.device }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gtmux-android-evidence
          if-no-files-found: warn
          retention-days: 7

  web:
    name: Web logic and rendered browser flows
    needs: scope
    if: needs.scope.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/web/package-lock.json
      - name: Web logic regressions
        run: node --test internal/server/web/*.test.cjs
      - name: Browser dependencies
        working-directory: tests/web
        run: npm ci && npx playwright install --with-deps chromium
      - name: Rendered desktop and narrow-screen flows (synthetic server)
        working-directory: tests/web
        run: npm test
      - name: Browser failure evidence
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: web-failure-evidence
          path: tests/web/results/
          retention-days: 7

  ios-native:
    name: iOS app and extensions compile (unsigned)
    needs: scope
    if: needs.scope.outputs.ios == 'true'
    runs-on: macos-15
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Runner space and SDK preflight
        run: |
          test "$(uname -m)" = arm64
          test -d "$DEVELOPER_DIR"
          python3 -c 'import shutil; n=shutil.disk_usage(".").free; print(f"Available: {n/1024**3:.1f} GiB"); assert n >= 25*1024**3, "Insufficient space for native CI build"'
          xcodebuild -version
          xcodebuild -showsdks
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobileapp/package-lock.json
      - uses: ruby/setup-ruby@e81a8fa391b11a595c1b7ed84177cc0fe02faf83 # v1
        with:
          working-directory: mobileapp
          bundler-cache: true
      - name: Dependencies (no signing setup)
        working-directory: mobileapp
        run: npm ci && (cd ios && bundle exec pod install)
      - name: Native HTML and Markdown behavior (production Foundation modules)
        run: python3 mobileapp/scripts/check-native-documents.py
      - name: Widget target and shared-data boundaries
        working-directory: mobileapp
        run: bundle exec ruby ios/tests/usage_widget_targets_test.rb

      - name: Compile app, Live Activity and notification extension
        working-directory: mobileapp
        run: |
          set -o pipefail
          xcodebuild -workspace ios/GtmuxMobile.xcworkspace -scheme GtmuxMobile \
            -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -jobs 2 \
            -derivedDataPath "$RUNNER_TEMP/gtmux-ios-ci" ARCHS=arm64 ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee "$RUNNER_TEMP/gtmux-ios-build.log"
      - name: Verify actual ARM64 app and extension products
        run: |
          python3 - <<'PY'
          import os, pathlib, plistlib, subprocess
          products = pathlib.Path(os.environ['RUNNER_TEMP']) / 'gtmux-ios-ci/Build/Products/Release-iphonesimulator'
          apps = list(products.glob('*.app'))
          assert len(apps) == 1, 'Expected one complete Simulator app'
          extensions = list((apps[0] / 'PlugIns').glob('*.appex'))
          assert len(extensions) == 2, 'Both app extensions must be embedded'
          for bundle in [apps[0], *extensions]:
              info = plistlib.loads((bundle / 'Info.plist').read_bytes())
              executable = bundle / info['CFBundleExecutable']
              architectures = subprocess.check_output(['lipo', '-archs', str(executable)], text=True).split()
              assert architectures == ['arm64'], 'Native product target differs from ARM64'
          print('Unsigned app and both embedded extensions verified as ARM64')
          PY
      - name: Install isolated iOS comparison driver
        if: github.event_name == 'pull_request' && (github.head_ref == 'feat/iphone-duo-adaptation' || github.head_ref == 'feat/iphone-duo-reviewed-integration')
        working-directory: mobileapp
        env:
          APPIUM_HOME: ${{ runner.temp }}/ios26-appium
        run: |
          driver_version=$(node -p "require('./package-lock.json').packages['node_modules/appium-xcuitest-driver'].version")
          npx appium driver install --source=npm "appium-xcuitest-driver@$driver_version"
      - name: Compare unmodified main and candidate on iOS 26
        id: server_compare26
        if: github.event_name == 'pull_request' && (github.head_ref == 'feat/iphone-duo-adaptation' || github.head_ref == 'feat/iphone-duo-reviewed-integration')
        env:
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          APPIUM_HOME: ${{ runner.temp }}/ios26-appium
          GTMUX_COMPARE_OS: '26.2'
          GTMUX_COMPARE_ADHOC: '1'
          GTMUX_COMPARE_DEVICE: iPhone 17
          GTMUX_E2E_SOFT_KEYBOARD: '1'
          GTMUX_E2E_HEADLESS: '1'
          GTMUX_E2E_ACCEPT_ALERTS: '1'
          GTMUX_E2E_SESSION_CI: '1'
        run: |
          set -o pipefail
          mkdir -p mobileapp/.e2e-artifacts/comparison
          bash mobileapp/e2e/ci-compare-servers.sh 2>&1 | tee mobileapp/.e2e-artifacts/comparison/setup.log
      - name: Preserve iOS 26 server comparison
        if: ${{ !cancelled() && steps.server_compare26.outcome != 'skipped' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: ios26-server-comparison-${{ github.run_id }}-${{ github.run_attempt }}
          path: mobileapp/.e2e-artifacts/comparison/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Native build failure evidence
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ios-native-build-log
          path: ${{ runner.temp }}/gtmux-ios-build.log
          retention-days: 7

  ios-duo:
    name: iPhone Duo simulator acceptance (ad-hoc)
    needs: scope
    if: needs.scope.outputs.ios == 'true'
    runs-on: xcode-27
    timeout-minutes: 120
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Runner space and SDK preflight
        run: |
          test "$(uname -m)" = arm64
          test -d "$DEVELOPER_DIR"
          python3 -c 'import shutil; n=shutil.disk_usage(".").free; print(f"Available: {n/1024**3:.1f} GiB"); assert n >= 25*1024**3, "Insufficient space for native CI build"'
          xcodebuild -version
          xcodebuild -showsdks
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobileapp/package-lock.json
      - uses: ruby/setup-ruby@e81a8fa391b11a595c1b7ed84177cc0fe02faf83 # v1
        with:
          working-directory: mobileapp
          bundler-cache: true
      - name: Dependencies (no signing setup)
        working-directory: mobileapp
        run: npm ci && (cd ios && bundle exec pod install)
      - name: Widget target and shared-data boundaries
        working-directory: mobileapp
        run: bundle exec ruby ios/tests/usage_widget_targets_test.rb

      - name: Compile app, Live Activity and notification extension
        working-directory: mobileapp
        run: |
          set -o pipefail
          xcodebuild -workspace ios/GtmuxMobile.xcworkspace -scheme GtmuxMobile \
            -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -jobs 2 \
            -derivedDataPath "$RUNNER_TEMP/gtmux-ios-ci" ARCHS=arm64 ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- \
            build 2>&1 | tee "$RUNNER_TEMP/gtmux-ios-build.log"
      - name: Verify actual ARM64 app and extension products
        id: ios_products
        run: |
          python3 - <<'PY'
          import os, pathlib, plistlib, subprocess
          products = pathlib.Path(os.environ['RUNNER_TEMP']) / 'gtmux-ios-ci/Build/Products/Release-iphonesimulator'
          apps = list(products.glob('*.app'))
          assert len(apps) == 1, 'Expected one complete Simulator app'
          extensions = list((apps[0] / 'PlugIns').glob('*.appex'))
          assert len(extensions) == 2, 'Both app extensions must be embedded'
          for bundle in [apps[0], *extensions]:
              info = plistlib.loads((bundle / 'Info.plist').read_bytes())
              executable = bundle / info['CFBundleExecutable']
              architectures = subprocess.check_output(['lipo', '-archs', str(executable)], text=True).split()
              assert architectures == ['arm64'], 'Native product target differs from ARM64'
              signature = subprocess.run(['codesign', '-dv', str(bundle)], capture_output=True, text=True, check=True).stderr
              assert 'Signature=adhoc' in signature, 'Expected an ad-hoc Simulator signature'
              print(signature)
          print('Ad-hoc signed app and both embedded extensions verified as ARM64')
          PY
      - name: Check native notification response encoding
        working-directory: mobileapp
        run: |
          xcrun swiftc ios/GtmuxMobile/NotificationResponsePayload.swift ios/tests/NotificationResponsePayloadChecks.swift -o "$RUNNER_TEMP/notification-response-check"
          "$RUNNER_TEMP/notification-response-check"
          xcrun swiftc ios/GtmuxMobile/NotificationResponsePayload.swift ios/tests/NotificationResponseCompletionChecks.swift -o "$RUNNER_TEMP/notification-completion-check"
          "$RUNNER_TEMP/notification-completion-check"
      - name: Install isolated iOS automation driver
        id: ios_driver
        working-directory: mobileapp
        env:
          APPIUM_HOME: ${{ runner.temp }}/duo-appium
        run: |
          # Duo hinge/display control requires the published Duo-capable WDA.
          # This isolated runner driver does not change local or production dependencies.
          npx appium driver install --source=npm 'appium-xcuitest-driver@12.20.0'
          python3 - <<'PY'
          import json, os, pathlib
          versions = {}
          for package in pathlib.Path(os.environ['APPIUM_HOME']).rglob('package.json'):
              try:
                  info = json.loads(package.read_text())
              except (OSError, ValueError):
                  continue
              if info.get('name') in ('appium-xcuitest-driver', 'appium-webdriveragent'):
                  versions.setdefault(info['name'], set()).add(info.get('version'))
          assert '12.20.0' in versions.get('appium-xcuitest-driver', set()), versions
          assert '16.17.1' in versions.get('appium-webdriveragent', set()), versions
          print('Verified isolated Duo driver 12.20.0 and WDA 16.17.1')
          PY
      - name: Probe iPhone Duo runtime and run isolated simulator interaction
        if: ${{ !cancelled() && steps.ios_products.outcome == 'success' && steps.ios_driver.outcome == 'success' }}
        working-directory: mobileapp
        env:
          APPIUM_HOME: ${{ runner.temp }}/duo-appium
          GTMUX_E2E_DEVICE: iPhone Duo
          GTMUX_E2E_OS: '27.1'
          GTMUX_E2E_SOFT_KEYBOARD: '1'
          GTMUX_E2E_HEADLESS: '1'
          GTMUX_E2E_ACCEPT_ALERTS: '1'
          GTMUX_E2E_SESSION_CI: '1'
        run: |
          set -euo pipefail
          xcrun simctl list -j devices available > "$RUNNER_TEMP/duo-devices.json"
          GTMUX_E2E_UDID=$(python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); matches=[x["udid"] for runtime, devices in d["devices"].items() if runtime.endswith("iOS-27-1") for x in devices if x["name"] == "iPhone Duo" and x["isAvailable"]]; assert len(matches)==1, matches; print(matches[0])' "$RUNNER_TEMP/duo-devices.json")
          export GTMUX_E2E_UDID
          xcrun simctl bootstatus "$GTMUX_E2E_UDID" -b
          xcrun simctl install "$GTMUX_E2E_UDID" "$RUNNER_TEMP/gtmux-ios-ci/Build/Products/Release-iphonesimulator/gtmux.app"
          npm run test:e2e -- --runInBand duo-window.test.ts duo-fold.test.ts notification-scene-actions.test.ts scene-usage-links.test.ts
      - name: Preserve notification diagnostics immediately
        if: ${{ !cancelled() && steps.ios_products.outcome == 'success' && steps.ios_driver.outcome == 'success' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: ios-notification-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            mobileapp/.e2e-artifacts/**/action-*
            mobileapp/.e2e-artifacts/**/scene-action-*
            mobileapp/.e2e-artifacts/**/warm-action-*
            mobileapp/.e2e-artifacts/**/usage-link-*
            mobileapp/.e2e-artifacts/**/fail-scene-*-usage-link-failed.*
            mobileapp/.e2e-artifacts/**/duo-fold-*
            mobileapp/.e2e-artifacts/**/fail-duo-fold*-failed.*
            mobileapp/.e2e-artifacts/**/fail-duo-large-text-failed.*
            mobileapp/.e2e-artifacts/**/fail-duo-rotation-failed.*
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
      - name: Ordinary iPhone simulator regression
        if: ${{ !cancelled() && steps.ios_products.outcome == 'success' && steps.ios_driver.outcome == 'success' }}
        working-directory: mobileapp
        env:
          APPIUM_HOME: ${{ runner.temp }}/duo-appium
          GTMUX_E2E_SOFT_KEYBOARD: '1'
          GTMUX_E2E_HEADLESS: '1'
          GTMUX_E2E_ACCEPT_ALERTS: '1'
          GTMUX_E2E_SESSION_CI: '1'
        run: |
          set -euo pipefail
          xcrun simctl list -j devices available > "$RUNNER_TEMP/ordinary-devices.json"
          duo_booted=$(python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); print(" ".join(x["udid"] for runtime, devices in d["devices"].items() if runtime.endswith("iOS-27-1") for x in devices if x["name"] == "iPhone Duo" and x["state"] == "Booted"))' "$RUNNER_TEMP/ordinary-devices.json")
          if [ -n "$duo_booted" ]; then xcrun simctl shutdown "$duo_booted"; fi
          GTMUX_E2E_UDID=$(python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); matches=[x["udid"] for runtime, devices in d["devices"].items() if runtime.endswith("iOS-27-0") for x in devices if x["name"] == "iPhone 17" and x["isAvailable"]]; assert len(matches)==1, matches; print(matches[0])' "$RUNNER_TEMP/ordinary-devices.json")
          export GTMUX_E2E_UDID GTMUX_E2E_DEVICE='iPhone 17' GTMUX_E2E_OS='27.0'
          xcrun simctl bootstatus "$GTMUX_E2E_UDID" -b
          xcrun simctl install "$GTMUX_E2E_UDID" "$RUNNER_TEMP/gtmux-ios-ci/Build/Products/Release-iphonesimulator/gtmux.app"
          npm run test:e2e -- --runInBand coldstart-push.test.ts
      - name: Preserve iPhone diagnostics immediately
        if: ${{ !cancelled() && steps.ios_products.outcome == 'success' && steps.ios_driver.outcome == 'success' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: ios-phone-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            mobileapp/.e2e-artifacts/**/debug-*
            mobileapp/.e2e-artifacts/**/requests-*
            mobileapp/.e2e-artifacts/**/c-*
            mobileapp/.e2e-artifacts/**/cold-summary.txt
            mobileapp/.e2e-artifacts/**/appium-startup.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
      - name: iPad simulator regression
        if: ${{ !cancelled() && steps.ios_products.outcome == 'success' && steps.ios_driver.outcome == 'success' }}
        working-directory: mobileapp
        env:
          APPIUM_HOME: ${{ runner.temp }}/duo-appium
          GTMUX_E2E_SOFT_KEYBOARD: '1'
          GTMUX_E2E_HEADLESS: '1'
          GTMUX_E2E_ACCEPT_ALERTS: '1'
          GTMUX_E2E_SESSION_CI: '1'
        run: |
          set -euo pipefail
          xcrun simctl list -j devices available > "$RUNNER_TEMP/ipad-devices.json"
          phone_booted=$(python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); print(" ".join(x["udid"] for runtime, devices in d["devices"].items() if runtime.endswith("iOS-27-0") for x in devices if x["name"] == "iPhone 17" and x["state"] == "Booted"))' "$RUNNER_TEMP/ipad-devices.json")
          if [ -n "$phone_booted" ]; then xcrun simctl shutdown "$phone_booted"; fi
          GTMUX_E2E_UDID=$(python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); matches=[x["udid"] for runtime, devices in d["devices"].items() if runtime.endswith("iOS-27-0") for x in devices if x["name"] == "iPad Pro 13-inch (M5)" and x["isAvailable"]]; assert len(matches)==1, matches; print(matches[0])' "$RUNNER_TEMP/ipad-devices.json")
          export GTMUX_E2E_UDID GTMUX_E2E_DEVICE='iPad Pro 13-inch (M5)' GTMUX_E2E_OS='27.0'
          xcrun simctl bootstatus "$GTMUX_E2E_UDID" -b
          xcrun simctl install "$GTMUX_E2E_UDID" "$RUNNER_TEMP/gtmux-ios-ci/Build/Products/Release-iphonesimulator/gtmux.app"
          npm run test:e2e -- --runInBand ipad-adaptive.test.ts
      - name: Preserve Duo interaction evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: duo-simulator-evidence
          path: |
            ${{ runner.temp }}/duo-devices.json
            ${{ runner.temp }}/ordinary-devices.json
            ${{ runner.temp }}/ipad-devices.json
            mobileapp/.e2e-artifacts/**
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7
      - name: Native build failure evidence
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ios-duo-build-log
          path: ${{ runner.temp }}/gtmux-ios-build.log
          retention-days: 7

  relay-worker:
    name: push relay worker (typecheck + golden payload)
    needs: scope
    if: needs.scope.outputs.relay == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: relay-worker/package-lock.json

      # The LIVE push relay is this Cloudflare Worker (the Go relay/ is a never-deployed
      # reference). Its APNs payload SHAPE must stay in sync with relay/apns.go; the
      # golden test is the only automated guard against silent drift. Deployed manually
      # via `wrangler deploy`, so this can't ship a tag — but a shape regression fails CI.
      - name: install deps
        run: cd relay-worker && npm ci

      - name: typecheck (tsc)
        run: cd relay-worker && npm run typecheck

      - name: golden payload test
        run: cd relay-worker && npm test

  tunnel-worker:
    name: tunnel worker (typecheck + lifecycle tests)
    needs: scope
    if: needs.scope.outputs.tunnel == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tunnel-worker/package-lock.json

      # The tunnel control-plane Worker (api.gtmux.ccy.dev). Deployed manually via
      # `wrangler deploy`, so this can't ship a tag — but it guards the abuse caps +
      # the daily reaper's decision function against a silent regression.
      - name: install deps
        run: cd tunnel-worker && npm ci

      - name: typecheck (tsc)
        run: cd tunnel-worker && npm run typecheck

      - name: lifecycle tests (unit + Workers runtime)
        run: cd tunnel-worker && npm test

  menubar:
    name: menu-bar app build (macOS)
    needs: scope
    if: needs.scope.outputs.menubar == 'true'
    runs-on: macos-26
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v5

      - name: Verify pinned Mac toolchain
        run: |
          test "$(uname -m)" = arm64
          test -d "$DEVELOPER_DIR"
          xcodebuild -version
          xcrun swift --version

      # The menu-bar app is native Swift (macapp/); compile + unit-test it here so
      # a PR can't break it unnoticed. (Linux jobs above can't build Swift/AppKit.)
      - name: swift build (release)
        run: cd macapp && swift build -c release --arch arm64 --arch x86_64

      - name: Usage widget snapshot and bounded native transport
        run: swift test --package-path shared/UsageWidgets

      - name: Native Mac host, WidgetKit metadata and bundled resources (unsigned)
        env:
          GTMUX_UNIVERSAL: '1'
        run: bash macapp/Widget/build-extension.sh

      - name: swift test (model + design conformance)
        env:
          GTMUX_WORKSPACE_PREVIEW_DIR: ${{ runner.temp }}/hq-workspace-previews
          GTMUX_WIDGET_RENDER_DIR: ${{ runner.temp }}/mac-widget-previews
        run: |
          mkdir -p "$GTMUX_WORKSPACE_PREVIEW_DIR"
          # Release AppKit window/animation resources between test cases.
          # One worker keeps desktop fixtures serial.
          cd macapp && swift test --parallel --num-workers 1

      # These fixtures contain synthetic records only; never capture the installed app.
      - name: HQ synthetic UI previews
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: hq-workspace-previews
          path: ${{ runner.temp }}/hq-workspace-previews/*.png
          retention-days: 7
          if-no-files-found: ignore

      - name: Native Mac widget synthetic previews
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: mac-widget-previews
          path: ${{ runner.temp }}/mac-widget-previews/*.png
          retention-days: 7
          if-no-files-found: ignore

      - name: design + architecture conformance
        run: ./scripts/check-design.sh

  ci-required:
    if: always()
    needs: [scope, quality, test, cross-build, mobile, web, ios-native, ios-duo, android-native, android-emulator, relay-worker, tunnel-worker, menubar]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Require successful selected checks
        env:
          CI_PLAN: ${{ needs.scope.outputs.plan }}
          CI_RESULTS: ${{ toJSON(needs) }}
        run: python3 scripts/ci.py verify
