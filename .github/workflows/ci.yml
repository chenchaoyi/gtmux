name: ci

# The workflow always starts; scripts/ci.py conservatively chooses module gates.
# ci-required is the stable aggregate: selected jobs must succeed, never skip.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      core: ${{ steps.plan.outputs.core }}
      cross: ${{ steps.plan.outputs.cross }}
      mobile: ${{ steps.plan.outputs.mobile }}
      web: ${{ steps.plan.outputs.web }}
      menubar: ${{ steps.plan.outputs.menubar }}
      relay: ${{ steps.plan.outputs.relay }}
      tunnel: ${{ steps.plan.outputs.tunnel }}
      ios: ${{ steps.plan.outputs.ios }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select checks (unknown impact runs everything)
        id: plan
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/ci.py plan

  quality:
    name: policy, docs and CI guards
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Scope, aggregation and scanner failure regression tests
        run: make ci-test publisher-test
      - name: Validate every workflow (no signing secrets)
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -shellcheck='' .github/workflows/*.yml
      - name: Source design, bilingual docs and strict specs
        run: ./scripts/check-design.sh --source-only
      - name: Documentation examples against real builders
        run: go test ./internal/docs

  test:
    needs: scope
    if: needs.scope.outputs.core == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.27'
          cache: true

      - name: gofmt check
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: staticcheck
        # The Makefile owns both the pinned analyzer and compatible analysis toolchain.
        run: make lint

      - name: Install isolated terminal test prerequisite
        run: sudo apt-get update && sudo apt-get install -y tmux

      - name: go test (race + coverage)
        run: go test -race -coverprofile=coverage.out ./...

      - name: Linux systemd user-service acceptance (ephemeral CI account)
        run: |
          go test -c -o "$RUNNER_TEMP/gtmux-userservice.test" ./internal/userservice
          install -m 755 "$RUNNER_TEMP/gtmux-userservice.test" /tmp/gtmux-userservice.test
          test_user=gtmux-ci
          sudo useradd --create-home --shell /bin/sh "$test_user"
          test_uid="$(id -u "$test_user")"
          trap 'sudo loginctl disable-linger "$test_user"; sudo loginctl terminate-user "$test_user"; sudo userdel --remove "$test_user"' EXIT
          sudo loginctl enable-linger "$test_user"
          for attempt in $(seq 1 30); do
            [ -S "/run/user/$test_uid/bus" ] && break
            sleep 1
          done
          sudo -u "$test_user" env HOME="/home/$test_user" XDG_RUNTIME_DIR="/run/user/$test_uid" DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$test_uid/bus" GTMUX_SYSTEMD_IT=1 /tmp/gtmux-userservice.test -test.v -test.run '^TestSystemdUserManagerLifecycle$'

      - name: Linux server acceptance (private tmux and HOME)
        run: |
          CGO_ENABLED=0 go build -o "$RUNNER_TEMP/gtmux-linux-smoke" ./cmd/gtmux
          python3 scripts/linux_smoke.py "$RUNNER_TEMP/gtmux-linux-smoke"

      - name: coverage summary
        run: go tool cover -func=coverage.out | tail -1

      - name: Preserve coverage for review
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: go-coverage
          path: coverage.out
          retention-days: 7

      # A reachable known vulnerability with a fix available fails the build; one with no
      # fix upstream yet is printed as a warning. See the script for why.
      - name: vulncheck (reachable known vulnerabilities)
        run: ./scripts/vulncheck.sh

      # Architecture + design-palette invariants (also run on macOS with swift test).
      - name: design + architecture conformance
        run: ./scripts/check-design.sh

  cross-build:
    needs: scope
    if: needs.scope.outputs.cross == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.27'
          cache: true

      # The CLI must stay cgo-free (only the menu-bar app uses cgo). Build both
      # macOS arches with CGO off to enforce that and catch arch-specific breaks.
      - name: build CLI cgo-free (macOS + Linux, arm64 + amd64)
        run: |
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -o /dev/null ./cmd/gtmux
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -o /dev/null ./cmd/gtmux
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o /dev/null ./cmd/gtmux
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o /dev/null ./cmd/gtmux

  mobile:
    name: mobile app (tsc + eslint + jest)
    needs: scope
    if: needs.scope.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobileapp/package-lock.json

      # JS-only gate (no native build): typecheck, lint, and unit tests. Keeps the
      # RN app's pure logic (pairing, ANSI parser, api client, i18n, theme) honest.
      - name: install deps
        run: cd mobileapp && npm ci

      - name: typecheck (tsc)
        run: cd mobileapp && npx tsc --noEmit

      - name: lint (eslint)
        run: cd mobileapp && npx eslint .

      - name: jest
        run: cd mobileapp && npx jest --ci

      - name: test delivery helpers (synthetic credentials, no network)
        run: python3 -m unittest discover -s mobileapp/scripts -p '*_test.py'

  web:
    name: Web logic and rendered browser flows
    needs: scope
    if: needs.scope.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/web/package-lock.json
      - name: Web logic regressions
        run: node --test internal/server/web/app.test.cjs
      - name: Browser dependencies
        working-directory: tests/web
        run: npm ci && npx playwright install --with-deps chromium
      - name: Rendered desktop and narrow-screen flows (synthetic server)
        working-directory: tests/web
        run: npm test
      - name: Browser failure evidence
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: web-failure-evidence
          path: tests/web/results/
          retention-days: 7

  ios-native:
    name: iOS app and extensions compile (unsigned)
    needs: scope
    if: needs.scope.outputs.ios == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Runner space and SDK preflight
        run: |
          python3 -c 'import shutil; n=shutil.disk_usage(".").free; print(f"Available: {n/1024**3:.1f} GiB"); assert n >= 25*1024**3, "Insufficient space for native CI build"'
          xcodebuild -version
          xcodebuild -showsdks
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobileapp/package-lock.json
      - uses: ruby/setup-ruby@e81a8fa391b11a595c1b7ed84177cc0fe02faf83 # v1
        with:
          working-directory: mobileapp
          bundler-cache: true
      - name: Dependencies (no signing setup)
        working-directory: mobileapp
        run: npm ci && (cd ios && bundle exec pod install)
      - name: Compile app, Live Activity and notification extension
        working-directory: mobileapp
        run: |
          set -o pipefail
          xcodebuild -workspace ios/GtmuxMobile.xcworkspace -scheme GtmuxMobile \
            -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -jobs 2 \
            -derivedDataPath "$RUNNER_TEMP/gtmux-ios-ci" ARCHS="$(uname -m)" CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee "$RUNNER_TEMP/gtmux-ios-build.log"
      - name: Native build failure evidence
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ios-native-build-log
          path: ${{ runner.temp }}/gtmux-ios-build.log
          retention-days: 7

  relay-worker:
    name: push relay worker (typecheck + golden payload)
    needs: scope
    if: needs.scope.outputs.relay == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: relay-worker/package-lock.json

      # The LIVE push relay is this Cloudflare Worker (the Go relay/ is a never-deployed
      # reference). Its APNs payload SHAPE must stay in sync with relay/apns.go; the
      # golden test is the only automated guard against silent drift. Deployed manually
      # via `wrangler deploy`, so this can't ship a tag — but a shape regression fails CI.
      - name: install deps
        run: cd relay-worker && npm ci

      - name: typecheck (tsc)
        run: cd relay-worker && npm run typecheck

      - name: golden payload test
        run: cd relay-worker && npm test

  tunnel-worker:
    name: tunnel worker (typecheck + lifecycle tests)
    needs: scope
    if: needs.scope.outputs.tunnel == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tunnel-worker/package-lock.json

      # The tunnel control-plane Worker (api.gtmux.ccy.dev). Deployed manually via
      # `wrangler deploy`, so this can't ship a tag — but it guards the abuse caps +
      # the daily reaper's decision function against a silent regression.
      - name: install deps
        run: cd tunnel-worker && npm ci

      - name: typecheck (tsc)
        run: cd tunnel-worker && npm run typecheck

      - name: lifecycle tests (unit + Workers runtime)
        run: cd tunnel-worker && npm test

  menubar:
    name: menu-bar app build (macOS)
    needs: scope
    if: needs.scope.outputs.menubar == 'true'
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      # The menu-bar app is native Swift (macapp/); compile + unit-test it here so
      # a PR can't break it unnoticed. (Linux jobs above can't build Swift/AppKit.)
      - name: swift build (release)
        run: cd macapp && swift build -c release

      - name: swift test (model + design conformance)
        run: cd macapp && swift test

      - name: design + architecture conformance
        run: ./scripts/check-design.sh

  ci-required:
    if: always()
    needs: [scope, quality, test, cross-build, mobile, web, ios-native, relay-worker, tunnel-worker, menubar]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Require successful selected checks
        env:
          CI_PLAN: ${{ needs.scope.outputs.plan }}
          CI_RESULTS: ${{ toJSON(needs) }}
        run: python3 scripts/ci.py verify
