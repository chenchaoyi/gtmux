# gtmux Direct — ONE nginx site, for a box whose :443 already belongs to an existing
# nginx (a personal site, an API, anything). Installed by install-server.sh with
# FRONT=nginx, which substitutes __DOMAIN__ and leaves every other site untouched.
#
# Three routes and nothing else:
#   /__gtmux/ping   answered here, with no Mac behind it: how a client times this server
#                   before it has an account on it, and how the operator checks a server
#                   with no device paired to it.
#   /p<port>/…      that Mac's reverse-forwarded serve. The port band is chisel's, so a
#                   crafted /p<lowport> cannot reach a system service; every serve is
#                   bearer-token-gated as well.
#   a root WebSocket upgrade → the chisel server, which is each Mac's control channel.
# Anything else is 404: this host name is not a web site.

map $http_upgrade $gtmux_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name __DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    # No web site lives here, and nothing should be cached on the way to a Mac.
    access_log off;
    proxy_cache off;

    location = /__gtmux/ping { return 204; }

    # A Mac's own port, with a path. Named captures, so proxy_pass carries an explicit
    # URI: with a variable in it, nginx passes what is written here, not the original.
    location ~ ^/p(?<tenant_port>[2-5][0-9]{4})(?<tenant_path>/.*)$ {
        proxy_pass http://127.0.0.1:$tenant_port$tenant_path$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $gtmux_upgrade;
        proxy_set_header Host $host;
        # SET, never append: the device roster reads the LAST entry, and it must be the
        # one this hop wrote. A header the caller chose is not evidence of anything.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;   # the event stream and an attached pane are streams
        proxy_read_timeout 1h; # a phone holds /api/events open
        proxy_send_timeout 1h;
    }

    # The same, for the bare /p<port> with no path at all.
    location ~ ^/p(?<bare_port>[2-5][0-9]{4})$ {
        proxy_pass http://127.0.0.1:$bare_port/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location / {
        # Only the chisel control channel lives at the root, and it is always an upgrade.
        if ($http_upgrade != websocket) { return 404; }
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
