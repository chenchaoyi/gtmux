# gtmux Direct — the HTTP-only site install-server.sh writes FIRST, so certbot has a
# server block to attach a certificate to. It serves the ACME challenge and nothing else.
# Once the certificate exists, re-running the installer replaces this with nginx-site.conf.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 404; }
}
