# Drop-in for the operated, MULTI-TENANT Direct server, installed by install-server.sh
# when DIRECT_SYNC_TOKEN is given (a personal server keeps the shared AUTH of the base
# unit: it has one tenant).
#
# One account per device from the authfile gtmux-authsync keeps current, each allowed
# only its own reverse port. There must be NO AUTH here: chisel pins an --auth user with
# UserAllowAll, which reload cannot drop and which is exactly the shared credential this
# replaced. A static user, because the authfile holds passwords and has to be readable by
# chisel alone.
[Service]
EnvironmentFile=
DynamicUser=no
User=gtmux-tunnel
Group=gtmux-tunnel
ProtectSystem=strict
ProtectHome=yes
PrivateTmp=yes
ExecStart=
ExecStart=/usr/local/bin/chisel server --host 127.0.0.1 --port 8080 --reverse --keepalive 25s --authfile /etc/gtmux-tunnel/users.json
