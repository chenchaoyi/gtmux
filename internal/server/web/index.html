<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>gtmux</title>
  <script id="web-base">
    // A Direct URL can end at /p<port> without a slash. Resolve assets inside
    // that Mac's path, before the browser encounters any stylesheet or script.
    (function () {
      var prefix = (location.pathname || '/').replace(/\/index\.html$/, '').replace(/\/+$/, '');
      window.GTMUX_WEB_BASE = prefix;
      var base = document.createElement('base');
      base.href = location.protocol + '//' + location.host + prefix + '/';
      document.head.appendChild(base);
    })();
  </script>
  <link rel="stylesheet" data-href="vendor/xterm.css" />
  <link rel="stylesheet" data-href="style.css" />
  <script>
    // Delay real asset attributes until the base is set: browsers can speculatively
    // fetch href/src before an earlier inline script has finished changing the base.
    Array.prototype.forEach.call(document.querySelectorAll('link[data-href]'), function (link) {
      link.href = link.getAttribute('data-href');
    });
  </script>
</head>
<body>
  <header id="bar">
    <div class="bar-inner">
      <button id="back" hidden>‹</button>
      <span id="title">gtmux</span>
      <!-- identity chip (WEB §11): owner = 全权, guest = 协作视图 — set from GET /api/share -->
      <span id="identity" class="id-chip" hidden></span>
      <span id="sub"></span>
      <!-- per-pane input capability (WEB §11): ⌨ 可输入 (cyan) / 👁 只读 (grey) -->
      <span id="cap" class="cap-chip" hidden></span>
      <span id="conn" class="conn"></span>
      <!-- Browse ALL panes (tiered-pane-control): the opt-in secondary surface — reach
           a pane in a session with no agent. Shown on the radar only; the workbench
           has its own session tree. -->
      <button id="panes-btn" hidden title="所有 pane" aria-label="所有 pane">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true" focusable="false">
          <rect x="3" y="4.5" width="18" height="15" rx="2.4" />
          <path d="M12 4.5V19.5M12 12H21" />
        </svg>
      </button>
      <span id="focus-nav" hidden>
        <button id="pane-prev" title="上一个 pane">‹</button>
        <button id="pane-next" title="下一个 pane">›</button>
      </span>
      <div id="mode" hidden>
        <button data-mode="chat">对话</button>
        <button data-mode="term">终端</button>
      </div>
      <span id="focus-ctl" hidden>
        <button id="font-dn" title="缩小">A−</button>
        <button id="font-up" title="放大">A+</button>
        <button id="copy-screen" title="复制当前屏幕">⧉</button>
      </span>
      <button id="gear" hidden title="外观">Aa</button>
    </div>
  </header>

  <!-- appearance: font + size -->
  <div id="settings" hidden>
    <div class="srow">
      <label id="font-lbl">字体</label>
      <select id="font-sel">
        <option id="font-auto" value="auto">跟随终端</option>
        <option id="font-system" value="system">系统</option>
        <option value="Hack">Hack</option>
        <option value="JetBrains Mono">JetBrains Mono</option>
        <option value="Fira Code">Fira Code</option>
        <option value="IBM Plex Mono">IBM Plex Mono</option>
      </select>
    </div>
    <div class="srow">
      <label id="size-lbl">字号</label>
      <input id="size-rng" type="range" min="10" max="22" step="1" />
      <span class="sz" id="size-val"></span>
    </div>
  </div>

  <!-- pairing / error gate. Structure, not one sentence: a reader who lands here (a
       bookmarked tunnel URL, an expired link) needs to know WHAT this page is, WHY it's
       empty, and the ONE thing to do — in both languages, like every other surface. -->
  <section id="gate" hidden>
    <div class="gate-box">
      <span class="gate-brand"><span class="wb-mark"><i></i><i class="lit"></i><i class="wide"></i></span>gtmux</span>
      <p id="gate-state" class="gate-state"></p>
      <div id="gate-steps" class="gate-steps"></div>
      <!-- The code box: a share link's token is 64 characters, which is fine to paste
           and impossible to type on a TV or a locked-down machine. The owner reads out a
           short one-time code instead, and this is where it goes. -->
      <form id="gate-code" class="gate-code" hidden>
        <label for="gate-code-input" id="gate-code-label"></label>
        <div class="gate-code-row">
          <input id="gate-code-input" autocomplete="off" autocapitalize="characters"
                 autocorrect="off" spellcheck="false" inputmode="latin" maxlength="16" />
          <button id="gate-code-go" type="submit"></button>
        </div>
        <p id="gate-code-why" class="gate-code-why" hidden></p>
      </form>
    </div>
  </section>

  <!-- desktop workbench: session tree rail + freeform board of concurrent panes
       (wide screens only; <900px falls back to the single-column radar→pane). -->
  <section id="workbench" hidden>
    <header id="wb-bar">
      <span class="wb-brand"><span class="wb-mark"><i></i><i class="lit"></i><i class="wide"></i></span>gtmux</span>
      <span id="wb-identity" class="id-chip" hidden></span>
      <span id="wb-preset-wrap">
        <button id="wb-preset" class="wb-toggle" title="布局预设">▦ 布局<span id="wb-preset-cur"></span> ▾</button>
        <div id="wb-preset-menu" hidden></div>
      </span>
      <button id="wb-snap" class="wb-toggle" title="贴齐网格"><span class="wb-sw"></span>贴齐网格</button>
      <button id="wb-surface" class="wb-toggle" title="自动显示等待中的 pane">⤢ 自动显示等待中的 pane</button>
      <span class="wb-spacer"></span>
      <span id="wb-conn" class="conn" title="连接"></span>
      <button id="wb-gear" title="外观">Aa</button>
    </header>
    <div id="wb-body">
      <aside id="rail">
        <div id="rail-head">
          <span class="rail-title" id="rail-title">会话</span>
          <span class="rail-spacer"></span>
          <input id="rail-search" placeholder="⌕ 搜索" />
          <button id="rail-collapse" title="收起侧栏">⇤</button>
        </div>
        <div id="tree"></div>
        <div class="rail-hint">拖 pane 到画板 · 双击加入画板</div>
        <div id="rail-resize" title="拖动调整宽度"><span></span></div>
      </aside>
      <button id="rail-tab" hidden title="显示侧栏">⇥<span id="rail-tab-n"></span></button>
      <div id="board"></div>
    </div>
  </section>

  <!-- agent radar -->
  <section id="radar" hidden></section>

  <!-- all-panes browser (tiered-pane-control): every tmux pane grouped session →
       window, so a pane in a session with no agent is one tap away. Its own header
       (back + search) — the #bar hides while this is up. Narrow path only. -->
  <section id="panes" hidden>
    <header id="panes-bar">
      <button id="panes-back" title="返回">‹</button>
      <span id="panes-title">所有 pane</span>
      <span id="panes-count" class="pb-count"></span>
      <span class="pb-spacer"></span>
      <button id="panes-fold-all" class="pb-foldall" hidden></button>
      <input id="panes-search" placeholder="⌕ 会话 / 命令 / 目录" autocomplete="off" spellcheck="false" />
    </header>
    <div id="panes-list"></div>
  </section>

  <!-- pane mirror -->
  <section id="pane" hidden>
    <!-- Codex's pinned prompt in full (app.js renderPane); hidden for every other screen -->
    <!-- Two real buttons side by side, never one inside the other: the toggle carries the
         label and aria-expanded, Copy copies. A click on the text toggles too. -->
    <div id="pinned" hidden>
      <span class="pin-mark" aria-hidden="true">›</span>
      <div class="pin-body"></div>
      <button class="pin-toggle" type="button" aria-expanded="false"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
      <button class="pin-copy" type="button"></button>
    </div>
    <div id="term"></div>
    <button id="jump" hidden>↓ 最新<span class="jdot" hidden></span></button>
    <!-- waiting: the parsed 1/2/3 — live buttons where this page may type, read-only
         chips plus the hint below where it may not (app.js renderReply) -->
    <div id="reply-bar" hidden>
      <span class="rb-lead">只读 · 在此 pane 回应：</span>
      <span id="reply-opts" class="rb-opts"></span>
      <span class="rb-hint">→ 这里只能查看：请分享者开启这个 pane 的输入，或在能输入的地方回应</span>
      <span class="rb-spacer"></span>
      <span id="reply-size" class="rb-size"></span>
    </div>
    <!-- input: shown where this page may type — the owner everywhere; a guest only with the
         host's consent and the pane on its allowlist (GET /api/share) -->
    <!-- the shared composer (multiline + image attach + key strip) is built by
         makeComposer() in app.js and mounted here -->
    <div id="pane-input" hidden></div>
    <!-- read-only pane: an explicit one-line explanation, never an empty textbox -->
    <div id="pane-ro" hidden>🔒 此 pane 不允许输入</div>
  </section>

  <!-- chat history (对话 mode) -->
  <section id="chat" hidden></section>

  <!-- ⌘K command palette: jump to / surface any pane (workbench) -->
  <div id="cmdk" hidden>
    <div id="cmdk-box">
      <input id="cmdk-input" placeholder="⌘K · 跳到 pane（输入名称 / agent / %id）" autocomplete="off" spellcheck="false" />
      <div id="cmdk-list"></div>
    </div>
  </div>

  <script data-src="vendor/xterm.js"></script>
  <script data-src="vendor/addon-fit.js"></script>
  <script data-src="vendor/addon-unicode11.js"></script>
  <script data-src="app.js"></script>
  <script>
    Array.prototype.forEach.call(document.querySelectorAll('script[data-src]'), function (slot) {
      var script = document.createElement('script');
      script.async = false; // xterm and its addons must execute before app.js.
      script.src = slot.getAttribute('data-src');
      slot.parentNode.replaceChild(script, slot);
    });
  </script>
</body>
</html>
